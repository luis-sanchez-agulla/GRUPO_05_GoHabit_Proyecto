services:
  backend:
    build:
      context: ./GoHabit-system/backend
    ports:
      - "3000:3000"
    container_name: gohabit-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "mysql://app:apppass@mysql:3306/goto"
      JWT_SECRET: "docker-secret-cambiar-en-produccion-min-16"
      JWT_EXPIRES_IN: "7d"
      NODE_ENV: "production"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-2.0-flash}"
      USE_OLLAMA: "${USE_OLLAMA:-false}"
      OLLAMA_API_URL: "${OLLAMA_API_URL:-http://ollama:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:3b-instruct}"
    depends_on:
      mysql:
        condition: service_healthy
      mysql-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const http=require('http');const req=http.get('http://backend:3000/api/health',res=>process.exit(res.statusCode===200?0:1));req.on('error',()=>process.exit(1));\""
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    # Límites para Raspberry Pi (comentar si despliegas en servidor potente)
    deploy:
      resources:
        limits:
          cpus: '1.5'      # Máximo 1.5 núcleos
          memory: 512M     # Máximo 512MB RAM
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"    # Máximo 10MB por archivo de log
        max-file: "3"      # Mantener 3 archivos rotativos

  frontend:
    build:
      context: ./GoHabit-system/frontend
    ports:
      - "8088:80"
    container_name: gohabit-frontend
    restart: unless-stopped
    depends_on:
      - backend
      - mysql
    volumes:
      # Bind mounts para reflejar SIEMPRE el frontend actual sin rebuild completo.
      - ./GoHabit-system/frontend/templates:/usr/share/nginx/html/templates:ro
      - ./GoHabit-system/frontend/css:/usr/share/nginx/html/css:ro
      - ./GoHabit-system/frontend/js:/usr/share/nginx/html/js:ro
      - ./GoHabit-system/frontend/assets:/usr/share/nginx/html/assets:ro
      - ./GoHabit-system/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # Límites para Raspberry Pi 
    deploy:
      resources:
        limits:
          cpus: '0.5'      
          memory: 128M     
        reservations:
          cpus: '0.25'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mysql:
    image: mysql:8.0
    container_name: gohabit-mysql
    restart: unless-stopped

    ports:
      - "3306:3306"

    environment:
      MYSQL_ROOT_PASSWORD: "rootpass"
      MYSQL_DATABASE: "gohabitdb"
      MYSQL_USER: "app"
      MYSQL_PASSWORD: "apppass"

    volumes:
      - mysql_data:/var/lib/mysql # persistencia (tablas/índices/datos)
      - ./GoHabit-system/mysql/conf.d:/etc/mysql/conf.d:ro # configuración extra (.cnf), solo lectura

      # Scripts de inicialización (deben ir como archivos en la raíz de /docker-entrypoint-initdb.d)
      - ./GoHabit-system/mysql/init-db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./GoHabit-system/mysql/init-db/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
      - ./GoHabit-system/mysql/init-db/queries.sql:/docker-entrypoint-initdb.d/03-queries.sql:ro
      - ./GoHabit-system/mysql/init-scripts/init-plugins.sql:/docker-entrypoint-initdb.d/11-init-plugins.sql:ro
      - ./GoHabit-system/mysql/init-scripts/init-users-roles.sql:/docker-entrypoint-initdb.d/12-init-users-roles.sql:ro
      - ./GoHabit-system/mysql/init-scripts/init-views.sql:/docker-entrypoint-initdb.d/13-init-views.sql:ro

    healthcheck:
      # indica cuándo MySQL está "listo"
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpass" ]
      interval: 10s
      timeout: 5s
      retries: 10
    # Límites para Raspberry Pi
    # NOTA: raspberry.cnf ya tiene optimizaciones internas de MySQL
    deploy:
      resources:
        limits:
          cpus: '1.0'      
          memory: 512M     
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mysql-bootstrap:
    image: mysql:8.0
    container_name: gohabit-mysql-bootstrap
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    command:
      - sh
      - -c
      - mysql -hmysql -uroot -prootpass goto < /bootstrap/01-schema.sql
    volumes:
      - ./GoHabit-system/mysql/init-db/schema.sql:/bootstrap/01-schema.sql:ro

  ollama:
    image: ollama/ollama:latest
    container_name: gohabit-ollama
    restart: unless-stopped
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
    volumes:
      - ollama_data:/root/.ollama  # Persistencia del modelo descargado
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    entrypoint: ["/bin/sh", "-lc"]
    # Script para descargar el modelo automáticamente
    command: >
      ollama serve &
      OLLAMA_PID=$$!;
      sleep 10;
      echo "Verificando modelo ${OLLAMA_MODEL:-qwen2.5:3b-instruct}...";
      ollama pull ${OLLAMA_MODEL:-qwen2.5:3b-instruct};
      wait $$OLLAMA_PID
    # Límites para Raspberry Pi
    deploy:
      resources:
        limits:
          cpus: '2.0'      # Usa 2 núcleos (importante para Ollama)
          memory: 3G       # Modelo ligero por defecto para mejor compatibilidad
        reservations:
          cpus: '1.0'
          memory: 1.5G
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  mysql_data:
  ollama_data:
