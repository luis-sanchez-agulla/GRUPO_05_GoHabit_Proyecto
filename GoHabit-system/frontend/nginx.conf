server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index templates/login.html;

    # Root always starts on login page.
    location = / {
        rewrite ^ /templates/login.html break;
    }

    # Force app pages to resolve from templates, with or without .html suffix.
    # This avoids accidentally serving nginx's default /usr/share/nginx/html/index.html.
    location ~* ^/(index|habitos|login|registro|perfil|avatar|tienda|anadirHabito|objeto|calendario|onboarding-ia|social)(\.html)?$ {
        rewrite ^/(index|habitos|login|registro|perfil|avatar|tienda|anadirHabito|objeto|calendario|onboarding-ia|social)(\.html)?$ /templates/$1.html break;
    }

    location / {
        try_files $uri $uri/ /templates/login.html;
    }

    # Prevent stale template caching in browser (old mock pages like "Alex").
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Ensure static files are accessible regardless of current "directory"
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        try_files $uri $uri/ /templates/$uri =404;
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }
}
