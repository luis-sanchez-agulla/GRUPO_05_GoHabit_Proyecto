server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index templates/login_register.html;

    location / {
        # Try serving as a direct file, then try as the login template
        try_files $uri $uri/ /templates/login_register.html;
    }

    # Handle template requests without the "templates/" prefix
    location ~* ^/(index|habitos|login_register|perfil|avatar|tienda|anadirHabito|objeto|calendario)$ {
        rewrite ^/(.*)$ /templates/$1.html break;
    }

    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Ensure static files are accessible regardless of current "directory"
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        try_files $uri $uri/ /templates/$uri =404;
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }
}
