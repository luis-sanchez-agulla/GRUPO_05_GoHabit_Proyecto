<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Frontend Evolution - Dashboard</title>
    <style>
        :root {
            --main-green: #76b900;
            --bg-dark: #f0f4f8;
            --glass-bg: rgba(255, 255, 255, 0.8);
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Contenedor Principal estilo "App" */
        .app-container {
            display: grid;
            grid-template-columns: 250px 1fr 300px;
            gap: 20px;
            width: 90%;
            height: 80vh;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            border: 2px solid #ddd;
        }

        /* Paneles laterales */
        .panel {
            background: var(--glass-bg);
            border: 1px solid #eee;
            border-radius: 15px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .panel-header {
            font-weight: bold;
            color: #555;
            border-bottom: 2px solid var(--main-green);
            padding-bottom: 5px;
            margin-bottom: 10px;
        }

        /* El Personaje (Centro) */
        .character-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, #fff 0%, #e0f2f1 100%);
            border-radius: 15px;
            position: relative;
        }

        .character-img {
            width: 200px;
            transition: transform 0.3s ease;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1));
        }

        .character-img:hover {
            transform: scale(1.1) rotate(5deg);
        }

        /* Botones de acción inferiores */
        .action-bar {
            grid-column: 1 / span 3;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 25px;
            border: none;
            background: var(--main-green);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover {
            filter: brightness(1.1);
            box-shadow: 0 5px 15px rgba(118, 185, 0, 0.4);
        }
    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
    <div class="panel">
        <div class="panel-header">Frontend Ideas</div>
        <p>• Wireframe inicial</p>
        <p>• UI Polishing</p>
        <p>• Responsive Design</p>
    </div>

    <div class="character-zone">
        <div style="position: absolute; top: 10px; font-weight: bold; color: #777;">DAY 45 (Status: Gold)</div>
        <img src="../assets/Gemini_Generated_Image_sg76pbsg76pbsg76.png" alt="Planta" class="character-img">
        <h2 style="color: #444;">LA MEJOR A</h2>
    </div>

    <div class="panel">
        <div class="panel-header">Growth Stats</div>
        <div style="background: #eee; height: 10px; border-radius: 5px;">
            <div style="background: var(--main-green); width: 85%; height: 100%; border-radius: 5px;"></div>
        </div>
        <span>Hydration: 85%</span>
        
        <div style="background: #eee; height: 10px; border-radius: 5px; margin-top: 10px;">
            <div style="background: orange; width: 60%; height: 100%; border-radius: 5px;"></div>
        </div>
        <span>Nutrition: 60%</span>
    </div>

    <div class="action-bar">
        <button class="btn">Light Levels</button>
        <button class="btn">Hydration</button>
        <button class="btn">Progress</button>
    </div>
</div>

</body>
</html>
