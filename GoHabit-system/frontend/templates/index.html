<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Meta Tags -->
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Pantalla de Inicio con Árbol Avatar</title>

    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/app.css">
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/chatbot.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
</head>
<body>
    <div class="index-container">
        <!-- Header Section -->
        <header class="index-header gh-fullbleed">
            <div>
                <p class="index-header__greeting">Buenos días,</p>
                <h1 class="index-header__title">Hola, <span data-user-first-name>Usuario</span></h1>
            </div>
            <div style="display:flex;align-items:center;gap:10px;">
                <div class="index-header__balance" aria-label="Semillas disponibles">
                    <span class="material-symbols-outlined index-header__balance-icon">eco</span>
                    <span class="index-header__balance-text" data-seeds>0</span>
                </div>
                <button class="gh-icon-btn" type="button" data-theme-toggle aria-label="Cambiar a modo oscuro">
                    <span class="material-symbols-outlined">dark_mode</span>
                </button>
            </div>
        </header>

        <!-- Main Tree Visual (Avatar) -->
        <div class="index-tree-section">
            <!-- Background glow effect -->
            <div class="index-tree-glow"></div>
            <div class="index-tree-container">
                <!-- Tree Image Placeholder -->
                <div class="index-tree-image"  data-avatar-image data-alt="Árbol avatar">
                </div>
                <!-- Floating Level Badge -->
                <div class="index-tree-badge">
                    <span class="index-tree-badge__level">Nivel <span data-user-level>1</span></span>
                    <span class="index-tree-badge__name" data-avatar-name>Roble Joven</span>
                </div>
            </div>
        </div>

        <!-- Content Area -->
        <div class="index-content">

            <!-- Water + Habit row -->
            <div class="index-widgets-row">

                <!-- 💧 WATER BUCKET WIDGET -->
                <div class="water-widget" id="waterWidget" aria-label="Seguimiento de agua">
                    <h3 class="water-widget__title">💧 Agua</h3>

                    <!-- Bucket visual -->
                    <div class="water-bucket" id="waterBucket" aria-hidden="true">
                        <div class="water-bucket__fill" id="waterFill"></div>
                        <div class="water-bucket__waves" id="waterWaves"></div>
                        <span class="water-bucket__label" id="waterLabel">0/8</span>
                    </div>

                    <p class="water-widget__sub" id="waterSub">0 de 8 vasos</p>

                    <div class="water-widget__controls">
                        <button class="water-widget__btn water-widget__btn--remove" id="waterRemove" aria-label="Quitar vaso">
                            <span class="material-symbols-outlined">remove</span>
                        </button>
                        <button class="water-widget__btn water-widget__btn--add" id="waterAdd" aria-label="Añadir vaso">
                            <span class="material-symbols-outlined">add</span>
                        </button>
                    </div>
                </div>

                <!-- Quick Task Card -->
                <div class="index-habit-quick">
                    <div class="index-task-header">
                        <h3 class="index-task-header__title">Siguiente Hábito</h3>
                        <a href="habitos.html" class="index-task-header__link">Ver todo</a>
                    </div>
                    <div class="index-task-card">
                        <!-- Progress Fill Indicator -->
                        <div class="index-task-card__indicator"></div>
                        <div class="index-task-card__icon">
                            <span class="material-symbols-outlined">task_alt</span>
                        </div>
                        <div class="index-task-card__content">
                            <h4 class="index-task-card__title">Cargando...</h4>
                            <div class="index-task-card__progress">
                                <div class="index-task-card__progress-bar">
                                    <div class="index-task-card__progress-fill"></div>
                                </div>
                                <span class="index-task-card__progress-text">0 / 1</span>
                            </div>
                        </div>
                        <button class="index-task-card__button" type="button" data-habit-toggle="1" aria-label="Marcar hábito como completado">
                            <span class="material-symbols-outlined">radio_button_unchecked</span>
                        </button>
                    </div>
                </div>

            </div>
        </div>

        <!-- Navigation Bar -->
 <nav class="index-nav">
  <div class="index-nav__container">
    <a href="index.html" class="index-nav__link index-nav__link--active">
      <span class="index-nav__icon">🏠</span>
      <span class="index-nav__text">Inicio</span>
    </a>

    <a href="habitos.html" class="index-nav__link ">
      <span class="index-nav__icon">✔️</span>
      <span class="index-nav__text">Hábitos</span>
    </a>

    <a href="avatar.html" class="index-nav__link">
      <span class="index-nav__icon">🌳</span>
      <span class="index-nav__text">Avatar</span>
    </a>

    <a href="tienda.html" class="index-nav__link">
      <span class="index-nav__icon">🛒</span>
      <span class="index-nav__text">Tienda</span>
    </a>

        <a href="social.html" class="index-nav__link">
          <span class="index-nav__icon">👥</span><span class="index-nav__text">Social</span>
        </a>
        <a href="perfil.html" class="index-nav__link">
          <span class="index-nav__icon">👤</span><span class="index-nav__text">Perfil</span>
        </a>
      </div>
    </nav>

    <script src="../js/api.js" defer></script>
    <script src="../js/router.js" defer></script>
    <script src="../js/session-user.js" defer></script>
    <script src="../js/app.js" defer></script>
    <script src="../js/pages/avatarImage.js" defer></script>
    <script src="../js/pages/index.js" defer></script>
    <script src="../js/chatbot.js" defer></script>
</body>
</html>
