<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Meta Tags -->
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Pantalla de Inicio con Árbol Avatar</title>

    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/app.css">
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/chatbot.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
</head>
<body>
    <header class="gh-header">
        <div class="gh-header__inner" style="max-width: none; margin: 0; padding-left: 1.25rem; width: 100%;">
            <div class="gh-header__left">
                <div class="gh-header__titles">
                    <p class="gh-header__kicker">BUENOS DÍAS,</p>
                    <h1 class="gh-header__headline">HOLA, DANIEL</h1>
                </div>
            </div>

            <div class="gh-header__right">
                <div class="gh-chip" aria-label="Semillas disponibles">
                    <span class="material-symbols-outlined">eco</span>
                    <span data-seeds>0</span>
                </div>

                <button type="button" class="gh-icon-btn" data-theme-toggle aria-label="Cambiar tema">
                    <span class="material-symbols-outlined">dark_mode</span>
                </button>
            </div>
        </div>
    </header>

    <div class="index-container">

        <!-- Main Tree Visual (Avatar) + Water Tank -->
        <div class="index-tree-section">
            <!-- Background glow effect -->
            <div class="index-tree-glow"></div>

            <div class="index-tree-container">
                <div class="index-tree-image" data-avatar-image></div>
                <div class="index-tree-badge">
                    <span class="index-tree-badge__level" data-avatar-level>Nivel 1</span>
                    <span class="index-tree-badge__name" data-avatar-name>Semilla</span>
                </div>
            </div>
        </div>

        <!-- Content Area -->
        <div class="index-content">
            <!-- Quick Task Card -->
            <div class="index-task-header">
                <h3 class="index-task-header__title">Siguiente Hábito</h3>
                <a href="habitos.html" class="index-task-header__link">Ver todo</a>
            </div>
            <div class="habit-card">
                <div class="habit-card__icon-container habit-card__icon-container--primary">
                    <span class="material-symbols-outlined" data-habit-icon>task_alt</span>
                </div>
                <div class="habit-card__content">
                    <h3 class="habit-card__title" data-habit-title>Cargando...</h3>
                    <p class="habit-card__category" data-habit-category>Categoría</p>
                </div>
                <label class="habit-checkbox">
                    <input class="habit-checkbox__input" type="checkbox" data-habit-toggle="1" />
                    <div class="habit-checkbox__box">
                        <span class="material-symbols-outlined habit-checkbox__icon">check</span>
                    </div>
                </label>
            </div>
        </div>

        <!-- Navigation Bar -->
        <nav class="index-nav">
          <div class="index-nav__container">
            <a href="index.html" class="index-nav__link index-nav__link--active">
              <span class="index-nav__icon">🏠</span>
              <span class="index-nav__text">Inicio</span>
            </a>
            <a href="habitos.html" class="index-nav__link ">
              <span class="index-nav__icon">✔️</span>
              <span class="index-nav__text">Hábitos</span>
            </a>
            <a href="avatar.html" class="index-nav__link">
              <span class="index-nav__icon">🌳</span>
              <span class="index-nav__text">Avatar</span>
            </a>
            <a href="tienda.html" class="index-nav__link">
              <span class="index-nav__icon">🛒</span>
              <span class="index-nav__text">Tienda</span>
            </a>
            <a href="social.html" class="index-nav__link">
              <span class="index-nav__icon">👥</span><span class="index-nav__text">Social</span>
            </a>
            <a href="perfil.html" class="index-nav__link">
              <span class="index-nav__icon">👤</span><span class="index-nav__text">Perfil</span>
            </a>
          </div>
        </nav>

    <script src="../js/api.js" defer></script>
    <script src="../js/router.js" defer></script>
    <script src="../js/session-user.js" defer></script>
    <script src="../js/app.js" defer></script>
    <script src="../js/pages/avatarImage.js" defer></script>
    <script src="../js/pages/index.js" defer></script>
    <script src="../js/chatbot.js" defer></script>
</body>
</html>
