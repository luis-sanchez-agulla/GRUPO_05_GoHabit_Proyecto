<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Meta Tags -->
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Pantalla de Inicio con Árbol Avatar</title>

    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/app.css">
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../css/index.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
</head>
<body>
    <div class="index-container">
        <!-- Header Section -->
        <header class="index-header gh-fullbleed">
            <div>
                <p class="index-header__greeting">Buenos días,</p>
                <h1 class="index-header__title">¡Hola, Alex!</h1>
            </div>
            <div style="display:flex;align-items:center;gap:10px;">
                <div class="index-header__balance" aria-label="Semillas disponibles">
                    <span class="material-symbols-outlined index-header__balance-icon">eco</span>
                    <span class="index-header__balance-text" data-seeds>1,250</span>
                </div>
                <button class="gh-icon-btn" type="button" data-theme-toggle aria-label="Cambiar a modo oscuro">
                    <span class="material-symbols-outlined">dark_mode</span>
                </button>
            </div>
        </header>

        <!-- Main Tree Visual (Avatar) -->
        <div class="index-tree-section">
            <!-- Background glow effect -->
            <div class="index-tree-glow"></div>
            <div class="index-tree-container">
                <!-- Tree Image Placeholder -->
                <div class="index-tree-image" data-avatar-image data-alt="Árbol avatar" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAVjO9jGOV1NPgGHkRpiszfA7j4bNqwVW2Tg76Hw1fgn_0w4gLNeXnGx-mCNh9_xY4VvLeT1IIh-orEBsrvjrlCHnxEhAUMFVwxpCYG7TpW6GtcXmLxBy2gtGgiRE4UofK7HCUMdGr4NpWVyB1IggbR76dsyHhpe-mA0O3gIYXWPFDYsxtDfDpfgIl-Euax_gp26WKVNUBr9yYf1AjStg0IrAG_bBGua3eGeAr6VDgRHX7H5NNFyNu0XGkqYj5NIisBbRv8livaJWY');">
                </div>
                <!-- Floating Level Badge -->
                <div class="index-tree-badge">
                    <span class="index-tree-badge__level" data-avatar-level>Nivel 5</span>
                    <span class="index-tree-badge__name" data-avatar-name>Roble Joven</span>
                </div>
            </div>
        </div>

        <!-- Content Area -->
        <div class="index-content">
            <!-- Quick Task Card -->
            <div>
                <div class="index-task-header">
                    <h3 class="index-task-header__title">Siguiente Hábito</h3>
                    <a href="habitos.html" class="index-task-header__link">Ver todo</a>
                </div>
                <div class="index-task-card">
                    <!-- Progress Fill Indicator -->
                    <div class="index-task-card__indicator"></div>
                    <div class="index-task-card__icon">
                        <span class="material-symbols-outlined">water_drop</span>
                    </div>
                    <div class="index-task-card__content">
                        <h4 class="index-task-card__title">Beber agua</h4>
                        <div class="index-task-card__progress">
                            <div class="index-task-card__progress-bar">
                                <div class="index-task-card__progress-fill"></div>
                            </div>
                            <span class="index-task-card__progress-text">1.5 / 2L</span>
                        </div>
                    </div>
                    <button class="index-task-card__button" type="button" data-habit-toggle="1" aria-label="Marcar hábito como completado">
                        <span class="material-symbols-outlined">radio_button_unchecked</span>
                    </button>
                </div>
            </div>

            <!-- Daily Goals Progress -->
            <div>
                <h3 class="index-progress-title">Tu Progreso Diario</h3>
                <div class="index-progress-grid">
                    <!-- Card 1 -->
                    <div class="index-progress-card index-progress-card--health">
                        <div class="index-progress-card__header">
                            <span class="material-symbols-outlined index-progress-card__icon">spa</span>
                            <span class="index-progress-card__percentage">85%</span>
                        </div>
                        <div>
                            <p class="index-progress-card__label">Salud</p>
                            <div class="index-progress-card__bar">
                                <div class="index-progress-card__bar-fill"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Card 2 -->
                    <div class="index-progress-card index-progress-card--mind">
                        <div class="index-progress-card__header">
                            <span class="material-symbols-outlined index-progress-card__icon">mindfulness</span>
                            <span class="index-progress-card__percentage">40%</span>
                        </div>
                        <div>
                            <p class="index-progress-card__label">Mente</p>
                            <div class="index-progress-card__bar">
                                <div class="index-progress-card__bar-fill"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Navigation Bar -->
 <nav class="index-nav">
  <div class="index-nav__container">
    <a href="index.html" class="index-nav__link index-nav__link--active">
      <span class="index-nav__icon">🏠</span>
      <span class="index-nav__text">Inicio</span>
    </a>

    <a href="habitos.html" class="index-nav__link ">
      <span class="index-nav__icon">✔️</span>
      <span class="index-nav__text">Hábitos</span>
    </a>

    <a href="avatar.html" class="index-nav__link">
      <span class="index-nav__icon">🌳</span>
      <span class="index-nav__text">Avatar</span>
    </a>

    <a href="tienda.html" class="index-nav__link">
      <span class="index-nav__icon">🛒</span>
      <span class="index-nav__text">Tienda</span>
    </a>

    <a href="perfil.html" class="index-nav__link">
      <span class="index-nav__icon">👤</span>
      <span class="index-nav__text">Perfil</span>
    </a>
  </div>
</nav>

    <script src="../js/app.js" defer></script>
    <script src="../js/pages/avatarImage.js" defer></script>
    <script src="../js/pages/index.js" defer></script>
</body>
</html>
