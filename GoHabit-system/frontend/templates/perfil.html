<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="../css/perfil.css">

  <title>Perfil de Usuario</title>
</head>

<body class="perfil-page">

  <!-- ✅ HEADER FULL WIDTH (fuera del container) -->
  <header class="gh-header">
    <div class="gh-header__inner gh-header__inner--home">

      <div class="gh-header__left">
        <a href="index.html" class="gh-icon-btn" aria-label="Volver">
          <span class="material-symbols-outlined">arrow_back</span>
        </a>

        <div class="gh-header__titles">
          <p class="gh-header__kicker">Tu cuenta</p>
          <h1 class="gh-header__headline">Perfil</h1>
        </div>
      </div>

      <div class="gh-header__right">
        <button type="button" class="gh-icon-btn" data-theme-toggle aria-label="Cambiar tema">
          <span class="material-symbols-outlined">dark_mode</span>
        </button>

        <button type="button" class="gh-icon-btn" aria-label="Ajustes (no implementado)">
          <span class="material-symbols-outlined">settings</span>
        </button>
      </div>

    </div>
  </header>

  <div class="perfil-container">

    <main class="perfil-main">

      <section class="perfil-profile-section">
        <div class="perfil-avatar-wrapper">
          <div class="perfil-avatar"
               data-alt="Professional headshot of a smiling man named Juan Perez"
               style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCWNdqHwtkDMyJ-GAgFvztWIwHq-6L1gYmO9SKgjT-uvZpQSRFEksEIWunusIjl6chIHrJmAe80zSz7OTZ8xpZUNcAZEa3p6RBdlQCGmrPWN6uXrSLE-02UZ2buVElTaZ6r3dP8eIUEr0CpAG65uGX2EGby_dVFqHQG3J1MwbtH9p94zgTRzyx5DCf9FhG6J4vWj4AArUJAHrivfBfbje6W9i2duMvQJbWGaUmOnuotX3j3VTs2o258h4Wvv3Nltpng5HSMuLj_ooo");'>
          </div>

          <div class="perfil-avatar-edit" aria-label="Editar avatar (no implementado)">
            <span class="material-symbols-outlined perfil-avatar-edit__icon">edit</span>
          </div>
        </div>

        <div class="perfil-user-info">
          <h1 class="perfil-user-info__name">Juan Pérez</h1>
          <p class="perfil-user-info__email">juan.perez@email.com</p>
        </div>
      </section>

      <section class="perfil-stats-section">
        <div class="perfil-stats-grid">

          <div class="perfil-stat-card">
            <div class="perfil-stat-card__header">
              <div class="perfil-stat-card__icon-wrapper perfil-stat-card__icon-wrapper--green">
                <span class="material-symbols-outlined">park</span>
              </div>
              <p class="perfil-stat-card__label">Nivel de Árbol</p>
            </div>
            <div class="perfil-stat-card__content">
              <p class="perfil-stat-card__value">12</p>
              <p class="perfil-stat-card__badge perfil-stat-card__badge--green">+2 este mes</p>
            </div>
          </div>

          <div class="perfil-stat-card">
            <div class="perfil-stat-card__header">
              <div class="perfil-stat-card__icon-wrapper perfil-stat-card__icon-wrapper--primary">
                <span class="material-symbols-outlined">local_fire_department</span>
              </div>
              <p class="perfil-stat-card__label">Días de Racha</p>
            </div>
            <div class="perfil-stat-card__content">
              <p class="perfil-stat-card__value">15</p>
              <p class="perfil-stat-card__badge perfil-stat-card__badge--primary">¡Sigue así!</p>
            </div>
          </div>

          <div class="perfil-stat-card">
            <div class="perfil-stat-card__header">
              <div class="perfil-stat-card__icon-wrapper perfil-stat-card__icon-wrapper--blue">
                <span class="material-symbols-outlined">task_alt</span>
              </div>
              <p class="perfil-stat-card__label">Hábitos Totales</p>
            </div>
            <div class="perfil-stat-card__content">
              <p class="perfil-stat-card__value">75</p>
              <p class="perfil-stat-card__badge perfil-stat-card__badge--blue">Completados</p>
            </div>
          </div>

        </div>
      </section>

      <section class="perfil-progress-section">
        <div class="perfil-progress-header">
          <h3 class="perfil-progress-header__title">Mi Progreso</h3>
          <a href="habitos.html" class="perfil-progress-header__link">Ver detalles</a>
        </div>

        <div class="perfil-progress-chart">
          <div class="perfil-progress-chart__bars">
            <div class="perfil-progress-chart__bar perfil-progress-chart__bar--inactive"></div>
            <div class="perfil-progress-chart__bar perfil-progress-chart__bar--inactive"></div>
            <div class="perfil-progress-chart__bar perfil-progress-chart__bar--inactive"></div>
            <div class="perfil-progress-chart__bar perfil-progress-chart__bar--active"></div>
            <div class="perfil-progress-chart__bar perfil-progress-chart__bar--inactive"></div>
            <div class="perfil-progress-chart__bar perfil-progress-chart__bar--inactive"></div>
            <div class="perfil-progress-chart__bar perfil-progress-chart__bar--inactive"></div>
          </div>
          <div class="perfil-progress-chart__labels">
            <span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span><span>Dom</span>
          </div>
        </div>
      </section>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="index-nav">
      <div class="index-nav__container">
        <a href="index.html" class="index-nav__link">
          <span class="index-nav__icon">🏠</span><span class="index-nav__text">Inicio</span>
        </a>
        <a href="habitos.html" class="index-nav__link">
          <span class="index-nav__icon">✔️</span><span class="index-nav__text">Hábitos</span>
        </a>
        <a href="avatar.html" class="index-nav__link">
          <span class="index-nav__icon">🌳</span><span class="index-nav__text">Avatar</span>
        </a>
        <a href="tienda.html" class="index-nav__link">
          <span class="index-nav__icon">🛒</span><span class="index-nav__text">Tienda</span>
        </a>
        <a href="perfil.html" class="index-nav__link index-nav__link--active">
          <span class="index-nav__icon">👤</span><span class="index-nav__text">Perfil</span>
        </a>
      </div>
    </nav>

  </div>

  <script src="../js/app.js" defer></script>
</body>
</html>
